version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sentinelstream-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      MYSQL_DATABASE: ${DB_NAME:-RANSOMWARE}
    expose:
      - "3306"
    volumes:
      - db-data:/var/lib/mysql
      - ../backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: backend
    container_name: sentinelstream-backend
    restart: always
    expose:
      - "5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      - DB_NAME=${DB_NAME:-RANSOMWARE}
      - DETECTOR_SECRET=${DETECTOR_SECRET:?DETECTOR_SECRET environment variable is required}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      target: frontend
    container_name: sentinelstream-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
