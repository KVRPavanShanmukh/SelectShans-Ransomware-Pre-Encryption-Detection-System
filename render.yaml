services:
  - type: web
    name: selectshans-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: RANSOMWARE
      - key: JWT_SECRET
        sync: false
      - key: DETECTOR_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: BACKEND_API_URL
        sync: false
      - key: CRON_SECRET
        sync: false
